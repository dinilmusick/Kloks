name: npm Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Explicitly approve publishing an unused package version (false = audit only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-trusted-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact verified release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert immutable verified commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          sha256sum package.json pnpm-lock.yaml

      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Update npm CLI
        run: npm install --global npm@latest

      - name: Verify Trusted Publishing configuration
        run: node scripts/verify-npm-trusted-publishing.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify package export targets and packed artifact
        run: pnpm run verify:package-exports

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Verify actual packed package in independent Node and Worker consumers
        run: node scripts/clean-room-boundary.mjs

      - name: Embed approved exact-source release attestation
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const sourceCommit = process.env.SOURCE_SHA;
          if (!/^[0-9a-f]{40}$/.test(sourceCommit)) throw new Error('Invalid immutable release SHA');
          fs.writeFileSync('.krusbl-release-attestation.json', JSON.stringify({
            schema: 1,
            packageName: pkg.name,
            version: pkg.version,
            sourceCommit,
            releaseWorkflow: process.env.GITHUB_WORKFLOW,
            workflowRunId: process.env.GITHUB_RUN_ID
          }, null, 2) + '\n');
          NODE

      - name: Pack exact artifact once and retain its checksum
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ultrst-release"
          npm pack --pack-destination "$RUNNER_TEMP/ultrst-release"
          sha256sum "$RUNNER_TEMP/ultrst-release"/*.tgz

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from "node:fs";
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (pkg.private) throw new Error("Refusing to publish a private package.");
          if (!pkg.name || !pkg.version) throw new Error("package.json requires name and version.");
          if (pkg.publishConfig?.registry !== "https://registry.npmjs.org/") {
            throw new Error("publishConfig.registry must be https://registry.npmjs.org/.");
          }
          console.log("name=" + pkg.name);
          console.log("version=" + pkg.version);
          NODE

      - name: Check version uniqueness without mistaking a registry outage for absence
        id: registry
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://registry.npmjs.org/ > "$RUNNER_TEMP/npm-version.out" 2> "$RUNNER_TEMP/npm-version.err"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Immutable package version already exists; no publication will be attempted."
          elif grep -Eq 'E404|404 Not Found' "$RUNNER_TEMP/npm-version.err"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "npm registry failed for a reason other than a missing version. Publication is blocked." >&2
            cat "$RUNNER_TEMP/npm-version.err" >&2
            exit 1
          fi

      - name: Mark previously published versions as historical artifacts, not this source release
        if: steps.registry.outputs.exists == 'true'
        run: echo "::warning::Existing npm version is being verified, but was not built or published from this workflow SHA."

      - name: Publish only on explicit approved main-branch dispatch
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish &&
          steps.registry.outputs.exists == 'false'
        run: |
          set -euo pipefail
          archive="$(find "$RUNNER_TEMP/ultrst-release" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$archive"
          npm publish "$archive" --provenance --access public

      - name: Independently verify downloadable npm tarball
        if: >-
          steps.registry.outputs.exists == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for attempt in $(seq 1 40); do
            rm -f "$tmp"/*.tgz
            cache="$(mktemp -d)"
            if NPM_CONFIG_CACHE="$cache" npm pack "${PACKAGE_NAME}@${PACKAGE_VERSION}" --silent --pack-destination "$tmp" > "$tmp/pack.log" 2> "$tmp/pack.err"; then
              tgz="$(find "$tmp" -maxdepth 1 -name '*.tgz' -print -quit)"
              if [ -n "$tgz" ] && tar -tzf "$tgz" > "$tmp/contents"; then
                required=(
                  "package/packages/backend/dist/provider-services/index.js"
                  "package/packages/backend/dist/provider-services/storage.js"
                  "package/packages/backend/dist/provider-services/google/index.js"
                )
                valid=true
                for target in "${required[@]}"; do
                  if ! grep -Fx "$target" "$tmp/contents" >/dev/null; then
                    echo "Published archive missing $target" >&2
                    valid=false
                  fi
                done
                if [ "$valid" = true ]; then
                  tar -xOzf "$tgz" package/package.json > "$tmp/published.json"
                  node -e '
                    const fs = require("fs");
                    const expected = JSON.parse(fs.readFileSync("package.json", "utf8"));
                    const actual = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                    if (expected.name !== actual.name || expected.version !== actual.version ||
                        expected.dependencies?.["@dinilmusick/gutts"] !== actual.dependencies?.["@dinilmusick/gutts"])
                      throw new Error("Published package metadata does not match verified source");
                  ' "$tmp/published.json"
                  echo "Verified downloadable ${PACKAGE_NAME}@${PACKAGE_VERSION} with expected provider APIs"
                  rm -rf "$cache"
                  exit 0
                fi
              fi
            fi
            rm -rf "$cache"
            echo "Archive not yet independently downloadable/complete: $attempt/40" >&2
            tail -n 3 "$tmp/pack.err" >&2 || true
            sleep 15
          done
          echo 'FATAL: npm metadata is visible, but package download/canonical exports remain unverified' >&2
          exit 1
      - name: Notify downstream consumers after successful upstream publication
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.publish &&
          steps.registry.outputs.exists == 'false'
        env:
          SYNC_TOKEN: ${{ secrets.ECOSYSTEM_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "ECOSYSTEM_SYNC_TOKEN is not configured; downstream scheduled sync remains the fallback."
            exit 0
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const consumers = ['Floks', 'Kult-Engine', 'Theta-Engine', 'Kelt-Engine', 'Skipo'];
          for (const consumer of consumers) {
            const response = await fetch(`https://api.github.com/repos/dinilmusick/${consumer}/dispatches`, {
              method: "POST",
              headers: {
                Authorization: "Bearer " + process.env.SYNC_TOKEN,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                event_type: "upstream-package-published",
                client_payload: {
                  package: pkg.name,
                  version: pkg.version,
                  repository: process.env.GITHUB_REPOSITORY,
                  commit: process.env.GITHUB_SHA,
                },
              }),
            });
            if (!response.ok) console.warn("Consumer dispatch warning for " + consumer + ": " + await response.text());
            else console.log("Notified " + consumer + " about " + pkg.name + "@" + pkg.version);
          }
          NODE
