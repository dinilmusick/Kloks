name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_PATH: /tmp/kloks-playwright/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Audit the exact Krnl tarball before dependency installation
        shell: bash
        run: |
          set -euo pipefail
          npm pack @ultrst-armada/krnl@1.0.13 --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/krnl-audit"
          tar -xzf "$RUNNER_TEMP/ultrst-armada-krnl-1.0.13.tgz" -C "$RUNNER_TEMP/krnl-audit"
          KRNL_PACKAGE_DIR="$RUNNER_TEMP/krnl-audit/package" node scripts/audit-krnl-artifact.mjs
      - run: pnpm install --force --no-frozen-lockfile
      - name: Capture generated lockfile for reconciliation
        if: always()
        run: |
          mkdir -p artifacts/diagnostics
          cp pnpm-lock.yaml artifacts/diagnostics/pnpm-lock.generated.yaml
      - name: Install isolated Playwright host runtime
        run: |
          npm install --prefix /tmp/kloks-playwright --no-save --package-lock=false playwright
          /tmp/kloks-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Build all packages
        run: |
          set -o pipefail
          mkdir -p artifacts/diagnostics
          pnpm build 2>&1 | tee artifacts/diagnostics/build.log
      - name: Audit the packed release artifact
        run: |
          set -euo pipefail
          PACKED="$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          mkdir -p "$RUNNER_TEMP/kloks-package" artifacts/security
          cp "$RUNNER_TEMP/$PACKED" artifacts/security/
          tar -xzf "$RUNNER_TEMP/$PACKED" -C "$RUNNER_TEMP/kloks-package"
          KLOKS_PACKAGE_DIR="$RUNNER_TEMP/kloks-package/package" node scripts/audit-release-artifact.mjs
      - name: Typecheck all packages
        if: always()
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee artifacts/diagnostics/typecheck.log
      - name: Run unit and browser-inspection tests
        if: always()
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee artifacts/diagnostics/test.log
      - name: Inspect published package contents
        if: always()
        run: npm pack --dry-run
      - name: Upload build, typecheck, test and browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kloks-diagnostics-and-playwright
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
