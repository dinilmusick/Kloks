name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_PATH: /tmp/kloks-playwright/node_modules
      PLAYWRIGHT_RUNTIME_PATH: /tmp/kloks-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact source commit and locked dependencies
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          sha256sum package.json pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated Playwright host runtime
        run: |
          set -euo pipefail
          PW_VERSION="$(node -p "require('./node_modules/playwright/package.json').version")"
          npm install --prefix /tmp/kloks-playwright --no-save --package-lock=false "playwright@$PW_VERSION"
          /tmp/kloks-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify isolated Playwright runtime
        run: node scripts/verify-playwright-runtime.mjs
      - name: Build all packages
        run: |
          set -o pipefail
          mkdir -p artifacts/diagnostics
          pnpm build 2>&1 | tee artifacts/diagnostics/build.log
      - name: Enforce package architecture boundaries
        if: always()
        run: pnpm boundary
      - name: Verify clean-room package boundary
        if: always()
        run: pnpm boundary:clean-room
      - name: Typecheck all packages
        if: always()
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee artifacts/diagnostics/typecheck.log
      - name: Run unit and browser-inspection tests
        if: always()
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee artifacts/diagnostics/test.log
      - name: Verify emitted package exports and declarations
        if: success()
        run: pnpm run verify:package-exports
      - name: Inspect published package contents
        if: always()
        run: npm pack --dry-run
      - name: Verify packed npm consumer and Cloudflare Worker imports
        if: success()
        run: |
          set -o pipefail
          node scripts/clean-room-boundary.mjs 2>&1 | tee artifacts/diagnostics/clean-room.log
      - name: Verify actual immutable npm registry artifact
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLIC_ARTIFACT_VERSION: 2.2.4
        run: node scripts/verify-public-npm-artifact.mjs
      - name: Pack exact-source release candidate and record checksum
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-evidence
          npm pack --pack-destination artifacts/release-evidence
          sha256sum artifacts/release-evidence/*.tgz > artifacts/release-evidence/candidate-sha256.txt
      - name: Check patch whitespace
        if: always()
        run: git diff --check "$(git merge-base origin/main HEAD)" HEAD
      - name: Upload build, typecheck, test and browser evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kloks-diagnostics-and-playwright
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  oauth-database:
    name: Verify Open OAuth Registration on Disposable PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_oauth
          POSTGRES_PASSWORD: disposable-only
          POSTGRES_DB: ci_oauth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_oauth -d ci_oauth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      DATABASE_URL: postgresql://ci_oauth:disposable-only@localhost:5432/ci_oauth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install ephemeral PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Create only the historical prerequisite table, not a registered app
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c             'CREATE TABLE public."ultrst-apps"(app_id varchar(120) PRIMARY KEY)'
      - name: Replay official Kloks BFF schema and public DCR migration
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1             -f packages/backend/db/migrations/006_kloks_oidc_bff.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1             -f packages/backend/db/migrations/007_kloks_open_oauth_registration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1             -f packages/backend/db/migrations/007_kloks_open_oauth_registration.sql
      - name: Independently verify arbitrary client and RLS without production data
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1             -f packages/backend/db/tests/007_open_public_oauth_registration.test.sql
