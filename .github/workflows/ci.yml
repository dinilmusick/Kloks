name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_PATH: /tmp/kloks-playwright/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --prefix /tmp/kloks-playwright --no-save --package-lock=false playwright
      - run: /tmp/kloks-playwright/node_modules/.bin/playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kloks-playwright-inspection
          path: artifacts/playwright/
          if-no-files-found: ignore
          retention-days: 14
