name: Package integrity
on:
  pull_request:
    paths:
      - 'package.json'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'package-lock.json'
      - 'scripts/verify-package-integrity.mjs'
      - '.github/workflows/package-integrity.yml'
      - 'scaffolds/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Diagnose GutTS 2.2.1 registry tarball
        run: |
          npm view @dinilmusick/gutts@2.2.1 version dist.tarball dist.integrity --json
          npm pack @dinilmusick/gutts@2.2.1 --dry-run --json > /tmp/gutts-registry-pack.json
          node -e "const a=require('/tmp/gutts-registry-pack.json');console.log(JSON.stringify({name:a[0]?.name,version:a[0]?.version,integrity:a[0]?.integrity}))"
      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm run test
      - name: Typecheck
        run: pnpm run typecheck
      - name: Pack, clean-install, and verify public package surface
        run: node scripts/verify-package-integrity.mjs
