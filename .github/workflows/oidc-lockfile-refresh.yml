name: Temporary OAuth Dependency Lockfile Refresh
on:
  push:
    branches: [fix/canonical-app-oauth-bff-20261119]
    paths: ['.github/workflows/oidc-lockfile-refresh.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Regenerate exact dependency lock from published npm registry
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile
          grep -q '@dinilmusick/gutts@2.2.3' pnpm-lock.yaml
          pnpm install --frozen-lockfile
      - name: Record normalized dependency lock on the current review branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Existing lockfile already matches the pinned source dependency'
          else
            git commit -m 'chore(auth): regenerate verified GutTS 2.2.3 frozen lockfile [skip ci]'
            git push origin HEAD:${{ github.ref_name }}
          fi
