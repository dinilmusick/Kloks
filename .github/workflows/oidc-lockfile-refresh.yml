name: OAuth Dependency Verification and Lockfile Refresh
on:
  push:
    branches: [fix/canonical-app-oauth-bff-20261119]
    paths: ['.github/workflows/oidc-lockfile-refresh.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Resolve verified published GutTS tarball
        run: |
          set -euo pipefail
          npm view @dinilmusick/gutts@2.2.3 dist.integrity --registry=https://registry.npmjs.org/
          pnpm install --lockfile-only --no-frozen-lockfile
          grep -q '@dinilmusick/gutts@2.2.3' pnpm-lock.yaml
          pnpm install --frozen-lockfile
          node --input-type=module -e "import('@dinilmusick/gutts/auth').then(m => { if (typeof m.createApplicationAuthClient !== 'function') process.exit(20); console.log('Verified published app OAuth client'); })"
      - name: Commit immutable dependency lock to OAuth review branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Frozen lock already matches exact published GutTS 2.2.3'
          else
            git commit -m 'chore(auth): resolve verified GutTS 2.2.3 npm release into frozen lockfile'
            git push origin HEAD:${{ github.ref_name }}
          fi
